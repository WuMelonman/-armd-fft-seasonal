model:
  target: Models.autoregressive_diffusion.armd.ARMD
  params:
    seq_length: 96
    feature_size: 5
    timesteps: 96
    sampling_timesteps: 1
    loss_type: 'l2'
    beta_schedule: 'cosine'
    w_grad: True

solver:
  base_lr: 1.0e-3
  max_epochs: 2000
  results_folder: ./Checkpoints_stock
  gradient_accumulate_every: 2
  save_cycle: 1800  # max_epochs // 10
  ema:
    decay: 0.995
    update_interval: 10
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 4000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500 
      verbose: False

dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      proportion: 0.8  # Set to rate < 1 if training conditional generation
      data_root: ./Data/datasets/stock_data.csv
      use_first_n_features: 5  # CSV 多列时只用前 5 列，与 model.feature_size 一致
      window: 192  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: train
      # 与论文一致：μ/σ 在整段序列上估计（股价有强漂移，train-only 会让 test 偏离到 mean≈3.8）
      scaler_fit_on_train_only: False

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: stock
      # divide(ratio) 把前 ratio 当 train、后面当 test；period=test 取后半段
      # 要用后 20% 做测试，这里必须是 0.8（不是 0.2）
      proportion: 0.8
      data_root: ./Data/datasets/stock_data.csv
      use_first_n_features: 5
      window: 192  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 2024
      period: test
      style: separate
      distribution: geometric
      scaler_fit_on_train_only: False
    coefficient: 1.0e-2
    step_size: 5.0e-2
    sampling_steps: 200

  batch_size: 128
  sample_size: 256
  shuffle: True
